<!doctype html><!-- Video latar tema Sekar Kedhaton (720×1280): turunan scene.html berpalet krem–taupe, pohon sepia & bunga lembayung (scripts/gerak/sekar.py). --><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000}
#v{position:relative;width:720px;height:1280px;overflow:hidden;background:#f4efe6}
.bg{position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 30%,#ffffff,transparent 70%),#f4efe6}
.glow{position:absolute;left:50%;top:200px;width:600px;height:400px;margin-left:-300px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.7),transparent);animation:pulse 8s ease-in-out infinite}
.cloud{position:absolute;opacity:0;animation:fade 1s ease .2s both,drift 8s ease-in-out infinite}
.c1{left:30px;top:170px;width:330px} .c2{right:20px;top:250px;width:260px;animation-delay:.35s,-4s}
.mount{position:absolute;left:0;bottom:0;width:720px;height:610px;animation:up 1s cubic-bezier(.2,.7,.2,1) .3s both}
.pend{position:absolute;left:150px;bottom:135px;width:520px;opacity:.9;animation:up2 1.1s cubic-bezier(.2,.7,.2,1) .5s both}
.tree{position:absolute;top:150px;width:430px;transform-origin:0 100%}
.tl{left:-215px;animation:kiri 1.5s ease .8s both} .tl img{animation:sway 8s ease-in-out infinite;transform-origin:20% 100%}
.tr{right:-215px;animation:kanan 1.5s ease .9s both} .tr img{transform:scaleX(-1)} .tr .s{animation:sway 8s ease-in-out -4s infinite;transform-origin:80% 100%}
.tree img{width:100%;display:block}
.sud{position:absolute;top:24px;width:250px;opacity:0;animation:rot 1.5s ease-out 1s both}
.sl{left:24px;transform-origin:0 0} .sr{right:24px;transform-origin:100% 0;--m:-1}
.sr img{transform:scaleX(-1)} .sud img{width:100%;display:block}
.flw{position:absolute;left:0;bottom:0;width:720px;height:200px;overflow:visible;opacity:.62}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.2s cubic-bezier(.2,.8,.3,1.1) calc(1.2s + var(--d)) both,fsway 4s ease-in-out infinite}
.birds{position:absolute;inset:0;width:720px;height:1280px}
.bird{animation:fly 8s linear infinite,flap .5s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -2s),calc(var(--i) * -.15s);transform-box:fill-box}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 220px 60px rgba(140,123,95,.2);pointer-events:none}
@keyframes fade{from{opacity:0}to{opacity:.7}}
@keyframes drift{0%,100%{translate:0 0}50%{translate:22px -6px}}
@keyframes up{from{transform:translateY(30%);opacity:0}}
@keyframes up2{from{transform:translateY(60%);opacity:0}}
@keyframes kiri{from{transform:translateX(-100%) scale(.93);opacity:0}30%{opacity:1}}
@keyframes kanan{from{transform:translateX(100%) scale(.93);opacity:0}30%{opacity:1}}
@keyframes rot{from{transform:rotate(calc(var(--m,1) * -60deg)) scale(.6);opacity:0}to{opacity:1}}
@keyframes sway{0%,100%{rotate:-1.2deg}50%{rotate:1.2deg}}
@keyframes grow{from{transform:scale(.2,.05);opacity:0}}
@keyframes fsway{0%,100%{rotate:-2deg}50%{rotate:2deg}}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes fly{0%{transform:translate(-80px,420px)}100%{transform:translate(820px,260px)}}
@keyframes flap{from{scale:1 1}to{scale:1 .35}}

.rays{position:absolute;left:50%;top:-260px;width:1400px;height:1400px;margin-left:-700px;opacity:0;
 background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(156,132,97,.06) 0 4deg,transparent 4deg 13deg);
 -webkit-mask:radial-gradient(closest-side,#000 10%,transparent 72%);animation:fadeR 2s ease .4s forwards,spin 8s linear infinite}
.mist{position:absolute;left:-40%;width:180%;height:140px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.6),transparent);filter:blur(8px);opacity:0;animation:fadeM 2s ease .6s forwards,mist 16s ease-in-out infinite}
.m1{bottom:330px}.m2{bottom:250px;animation-delay:.9s,-8s}
.bfs{position:absolute;inset:0;width:720px;height:1280px}
.bf{animation:bfly 8s ease-in-out infinite;animation-delay:calc(var(--i) * -2s)}
.bfw{animation:wing .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.pt{position:absolute;top:-30px;width:14px;height:18px;border-radius:80% 0 80% 0;background:linear-gradient(135deg,#f4ecf8,#8c7b5f);opacity:.85;
 animation:fall 8s linear infinite;animation-delay:calc(var(--i) * -.8s)}
#v>.bg{animation:push 8s ease-in-out infinite}
@keyframes fadeR{to{opacity:1}}@keyframes fadeM{to{opacity:1}}
@keyframes spin{to{transform:rotate(13deg)}}
@keyframes mist{0%,100%{translate:0 0}50%{translate:12% -10px}}
@keyframes bfly{0%{transform:translate(120px,820px)}25%{transform:translate(300px,640px)}50%{transform:translate(560px,700px)}75%{transform:translate(420px,900px)}100%{transform:translate(120px,820px)}}
@keyframes wing{from{scale:1 1}to{scale:.25 1}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(60px,1340px) rotate(720deg)}}
@keyframes push{0%,100%{scale:1}50%{scale:1.03}}
