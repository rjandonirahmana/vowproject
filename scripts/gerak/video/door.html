<!doctype html><html><head><meta charset="utf-8"><style>
/* Video pembuka tema Gunungan Wayang Kulit (720×1280, 3,8 dtk).
   0,0–0,9  kusen gebyok naik; gunungan emas di sambungan kedua daun pintu
   0,9–1,6  gunungan berkilau, cahaya blencong merembes lewat celah
   1,6–2,9  daun pintu berayun KE DALAM (menjauhi penonton) — gunungan terbelah
   2,4–3,7  kamera melangkah masuk menembus kusen; akhir = frame awal video latar
   Arah ayunan: engsel kiri rotateY(+), engsel kanan rotateY(−) → tepi bebas
   menjauh (z negatif). Tanda sebaliknya membuat pintu terayun KELUAR. */
html,body{margin:0;background:#000}
:root{--bg:#16120c;--gold:#e3c27a;--gold-l:#f3dfa6;--gold-d:#a8792f;--wood:#3b2812;--foil:linear-gradient(135deg,#9c7330,#f1d78f 50%,#8a6424)}
#v{position:relative;width:720px;height:1280px;overflow:hidden;background:var(--bg)}
.bg{position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 30%,#2a2014,transparent 70%),url(w/latar.svg) center/720px auto,var(--bg)}
.glow{position:absolute;left:50%;top:200px;width:600px;height:400px;margin-left:-300px;border-radius:50%;background:radial-gradient(closest-side,rgba(227,194,122,.16),transparent);opacity:.7}

/* Ruang di balik pintu: kelir diterangi blencong + bayang gunungan. */
.inner{position:absolute;left:11.5%;right:11.5%;top:9%;bottom:4%;overflow:hidden;transform-origin:50% 46%;
 animation:in-rise .9s cubic-bezier(.65,0,.35,1) both,in-push 1.2s cubic-bezier(.5,0,.75,0) 2.4s both,in-out .7s ease-in-out 3.0s forwards}
.inner::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 42%,#fff4d6,#e9c886 38%,#6b4a1e 78%,#24170a)}
.shadow{position:absolute;left:50%;top:15%;width:330px;height:517px;margin-left:-165px;background:#1c1208;opacity:.55;filter:blur(3px);
 -webkit-mask:url(g/gunungan.svg) center/contain no-repeat;transform-origin:50% 90%;animation:sway 2.2s ease-in-out .6s both}
.dust i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff3cf;box-shadow:0 0 10px #ffe2a0;opacity:0;
 animation:dust 1.6s ease-out calc(1.7s + var(--i) * .05s) both}

/* Kusen + daun pintu. Perspektif di .door, daun berputar di dalamnya. */
.door{position:absolute;inset:0;perspective:1400px;perspective-origin:50% 46%;transform-origin:50% 46%;
 animation:rise .9s cubic-bezier(.65,0,.35,1) both,through 1.2s cubic-bezier(.5,0,.75,0) 2.4s forwards}
.frame{position:absolute;inset:0;z-index:2;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}
.frame::before,.frame::after{content:"";position:absolute;inset:0}
.frame::before{background:linear-gradient(90deg,#24170a,var(--wood) 12%,#4a3317 50%,var(--wood) 88%,#24170a);
 -webkit-mask:url(g/gebyok-mahkota.svg) top center/100% auto no-repeat,linear-gradient(#000 0 0) left top/12% 100% no-repeat,linear-gradient(#000 0 0) right top/12% 100% no-repeat,linear-gradient(#000 0 0) bottom/100% 4% no-repeat}
.frame::after{background:var(--foil);
 -webkit-mask:url(g/gebyok-mahkota-ukir.svg) top center/100% auto no-repeat,url(g/gebyok-tiang.svg) left 1.5% top/9% auto repeat-y,url(g/gebyok-tiang.svg) right 1.5% top/9% auto repeat-y}
.leaf{position:absolute;top:0;bottom:4%;width:38.5%;z-index:1;overflow:hidden;
 background:radial-gradient(circle at var(--k) 64%,var(--gold-l) 0 8px,var(--gold-d) 9px 12px,transparent 13px),linear-gradient(180deg,#24170a,var(--wood) 30%,#2a1b0b);
 box-shadow:inset 0 0 0 9px var(--gold),inset 0 0 0 13px #24170a,inset 0 0 0 16px var(--gold-l),inset 0 0 60px rgba(0,0,0,.55)}
.leaf::before{content:"";position:absolute;inset:20px;opacity:.3;background:var(--gold-l);-webkit-mask:url(g/kisi.svg) center/30px 30px repeat}
/* Bayangan saat daun menjauh dari cahaya penonton. */
.leaf::after{content:"";position:absolute;inset:0;background:#0b0704;opacity:0;animation:dim 1.3s ease-in 1.6s forwards}
.l{left:11.5%;transform-origin:left center;--k:calc(100% - 30px);animation:open-l 1.3s cubic-bezier(.45,0,.2,1) 1.6s both}
.r{right:11.5%;transform-origin:right center;--k:30px;animation:open-r 1.3s cubic-bezier(.45,0,.2,1) 1.6s both}
/* Gunungan utuh di sambungan; tiap daun membawa separuhnya. */
.gn{position:absolute;top:20%;width:250px;height:392px;z-index:1}
.l .gn{right:-125px} .r .gn{left:-125px}
.gn b{position:absolute;inset:0;background:var(--foil);-webkit-mask:url(g/gunungan.svg) center/contain no-repeat;
 filter:drop-shadow(0 0 0 transparent);animation:gn-in .8s cubic-bezier(.2,.8,.3,1.2) .6s both}
.gn b::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,250,225,.95) 50%,transparent 65%) 0 0/300% 100% no-repeat;
 background-position:120% 0;animation:shine .8s ease-in-out 1.05s both}

/* Cahaya yang merembes lalu meluap dari celah pintu (di depan daun). */
.light{position:absolute;left:50%;top:46%;width:300px;height:1000px;margin:-500px 0 0 -150px;border-radius:50%;z-index:3;mix-blend-mode:screen;
 background:radial-gradient(closest-side,rgba(255,240,200,.95),rgba(227,194,122,.4) 45%,transparent);opacity:0;transform:scaleX(.04);
 animation:seam .5s ease-out 1.15s forwards,spill 1.4s ease-in-out 1.6s forwards}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 220px 60px rgba(0,0,0,.6);pointer-events:none;z-index:5}

@keyframes rise{from{transform:translateY(100%)}}
@keyframes in-rise{from{transform:translateY(100%)}}
@keyframes gn-in{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-120% 0}}
@keyframes sway{0%{transform:rotate(-7deg) scale(.9);opacity:0}40%{opacity:.55;transform:rotate(5deg)}75%{transform:rotate(-2deg)}100%{transform:none;opacity:.55}}
/* Membuka: sedikit "klik" (2°) lalu terayun ke dalam hingga 84°. */
@keyframes open-l{0%{transform:rotateY(0)}12%{transform:rotateY(4deg)}22%{transform:rotateY(2deg)}100%{transform:rotateY(84deg)}}
@keyframes open-r{0%{transform:rotateY(0)}12%{transform:rotateY(-4deg)}22%{transform:rotateY(-2deg)}100%{transform:rotateY(-84deg)}}
@keyframes dim{to{opacity:.55}}
@keyframes seam{to{opacity:.9}}
@keyframes spill{0%{transform:scaleX(.04);opacity:.9}55%{transform:scale(1.6,1.05);opacity:1}100%{transform:scale(2.6,1.3);opacity:0}}
@keyframes dust{0%{opacity:0;transform:none}25%{opacity:1}100%{opacity:0;transform:translate(calc((var(--i) - 7) * 34px),calc(var(--y) * 1px)) scale(2.4)}}
@keyframes through{to{transform:scale(3.6);opacity:0}}
@keyframes in-push{to{transform:scale(1.9)}}
@keyframes in-out{to{opacity:0}}
</style></head><body><div id="v"><div class="bg"></div><div class="glow"></div>
<div class="inner"><div class="shadow"></div>
<div class="dust"><i style="--i:0;--y:-120;left:22%;top:34%"></i><i style="--i:1;--y:90;left:30%;top:62%"></i><i style="--i:2;--y:-60;left:36%;top:48%"></i><i style="--i:3;--y:140;left:41%;top:70%"></i><i style="--i:4;--y:-160;left:45%;top:28%"></i><i style="--i:5;--y:40;left:48%;top:55%"></i><i style="--i:6;--y:-90;left:51%;top:40%"></i><i style="--i:7;--y:120;left:54%;top:66%"></i><i style="--i:8;--y:-140;left:57%;top:31%"></i><i style="--i:9;--y:60;left:61%;top:58%"></i><i style="--i:10;--y:-50;left:66%;top:45%"></i><i style="--i:11;--y:150;left:70%;top:72%"></i><i style="--i:12;--y:-110;left:76%;top:36%"></i><i style="--i:13;--y:80;left:80%;top:60%"></i></div>
</div>
<div class="door"><div class="leaf l"><div class="gn"><b></b></div></div><div class="leaf r"><div class="gn"><b></b></div></div><div class="frame"></div><div class="light"></div></div>
<div class="vig"></div></div></body></html>
