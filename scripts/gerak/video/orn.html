<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
.s{position:relative;overflow:hidden;display:none}
body[data-k=ksatria] #ksatria, body[data-k=putri] #putri, body[data-k=sudut] #sudut, body[data-k=kupu] #kupu, body[data-k=burung] #burung{display:block}
/* wayang: bergoyang di tangkai (poros bawah) + tangan (cempurit) bergerak */
#ksatria,#putri{width:180px;height:384px}
#ksatria img,#putri img{position:absolute;inset:0;width:180px;transform-origin:50% 100%;animation:goy 2s ease-in-out infinite}
#putri img{animation-delay:-1s}
@keyframes goy{0%,100%{transform:rotate(-2.2deg) translateY(0)}50%{transform:rotate(2.2deg) translateY(-4px)}}
/* sudut ukir: kilau emas berjalan menyusuri ukiran */
#sudut{width:240px;height:240px}
#sudut img{position:absolute;inset:0;width:240px}
#sudut .k{position:absolute;inset:0;-webkit-mask:url(w/sudut.svg) center/contain no-repeat;background:linear-gradient(120deg,transparent 35%,rgba(255,250,225,.95) 50%,transparent 65%) 0 0/300% 300%;animation:kilau 2s linear infinite}
@keyframes kilau{from{background-position:100% 100%}to{background-position:0 0}}
/* kupu-kupu berkepak & melayang */
#kupu{width:160px;height:160px}
.kp{position:absolute;left:50%;top:50%;animation:kh 2s ease-in-out infinite}
.wg{position:absolute;top:-30px;width:46px;height:56px;transform-origin:100% 50%;animation:fl .25s ease-in-out infinite alternate}
.wg.r{left:0;transform-origin:0 50%}
.wg.l{right:0}
.wg path{fill:url(#gd)}
@keyframes kh{0%,100%{transform:translate(-50%,-50%) rotate(-8deg)}50%{transform:translate(-50%,-62%) rotate(6deg)}}
@keyframes fl{from{transform:scaleX(1)}to{transform:scaleX(.18)}}
/* kawanan burung */
#burung{width:420px;height:220px}
.bd{position:absolute;animation:bd 2s ease-in-out infinite}
.bd svg{display:block;animation:fp .5s ease-in-out infinite alternate}
@keyframes bd{0%,100%{translate:0 0}50%{translate:6px -8px}}
@keyframes fp{from{scale:1 1}to{scale:1 .3}}
</style></head><body data-k="ksatria">
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e2a8"/><stop offset=".55" stop-color="#e3c27a"/><stop offset="1" stop-color="#a8792f"/></linearGradient></defs></svg>
<div class="s" id="ksatria"><img src="w/wayang-ksatria.svg"></div>
<div class="s" id="putri"><img src="w/wayang-putri.svg"></div>
<div class="s" id="sudut"><img src="w/sudut.svg"><div class="k"></div></div>
<div class="s" id="kupu"><div class="kp">
 <svg class="wg l" viewBox="0 0 46 56"><path d="M46 28 C30 -6 0 2 6 22 C10 34 30 32 46 30Z M46 32 C30 34 10 46 18 54 C26 58 40 46 46 34Z"/></svg>
 <svg class="wg r" viewBox="0 0 46 56" style="transform:scaleX(-1)"><path d="M46 28 C30 -6 0 2 6 22 C10 34 30 32 46 30Z M46 32 C30 34 10 46 18 54 C26 58 40 46 46 34Z"/></svg>
 <svg viewBox="0 0 6 40" style="position:absolute;left:-3px;top:-30px;width:6px;height:40px"><rect width="6" height="40" rx="3" fill="#5a3f17"/></svg>
</div></div>
<div class="s" id="burung">
 <div class="bd" style="left:40px;top:120px;animation-delay:-.2s"><svg width="70" height="30" viewBox="0 0 70 30"><path d="M2 20 Q18 2 35 18 Q52 2 68 20" fill="none" stroke="#e3c27a" stroke-width="4" stroke-linecap="round"/></svg></div>
 <div class="bd" style="left:150px;top:50px;animation-delay:-.9s"><svg width="56" height="24" viewBox="0 0 70 30"><path d="M2 20 Q18 2 35 18 Q52 2 68 20" fill="none" stroke="#f3dfa6" stroke-width="4" stroke-linecap="round" style="animation-delay:-.2s"/></svg></div>
 <div class="bd" style="left:250px;top:110px;animation-delay:-1.4s"><svg width="64" height="28" viewBox="0 0 70 30"><path d="M2 20 Q18 2 35 18 Q52 2 68 20" fill="none" stroke="#e3c27a" stroke-width="4" stroke-linecap="round"/></svg></div>
 <div class="bd" style="left:330px;top:40px;animation-delay:-.5s"><svg width="44" height="20" viewBox="0 0 70 30"><path d="M2 20 Q18 2 35 18 Q52 2 68 20" fill="none" stroke="#f3dfa6" stroke-width="4" stroke-linecap="round"/></svg></div>
</div>
</body></html>
