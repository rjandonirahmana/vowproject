# ═══════════════════════════════════════════════════════════════════════════════
# susur-gl — perender WebGL2 tema SUSUR 3D (web/susur.rs). WASM KECIL yang
# berdiri sendiri, terpisah dari bundel Leptos (±3 MB): dimuat langsung saat
# undangan dibuka tanpa menunggu hydrate. Data dunia (jalur, pose, benda)
# disertakan dari src/web/susur/dunia.rs — satu sumber dengan server.
#
# Bangun: scripts/susur-gl.sh  → src/web/susur/gl/ (di-embed binary server,
# dilayani /susur/gl.js & /susur/gl.wasm ber-versi hash).
# ═══════════════════════════════════════════════════════════════════════════════

[package]
name = "susur-gl"
version = "0.1.0"
edition = "2021"
publish = false

# Akar workspace sendiri — bukan bagian crate undangan.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Dikunci sama dengan crate undangan & CLI wasm-bindgen global.
wasm-bindgen = "=0.2.122"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlImageElement",
    "CanvasRenderingContext2d", "TextMetrics", "CssStyleDeclaration", "DomRect", "DomTokenList",
    "DomStringMap", "NodeList", "Event", "EventTarget", "Performance", "MediaQueryList",
    "FontFaceSet", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit",
    "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlTexture",
    "WebGlUniformLocation", "WebGlVertexArrayObject",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
